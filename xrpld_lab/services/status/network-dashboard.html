<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xrpld network status</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e9ef;
    --dim: #8b93a7; --accent: #4da3ff; --accent2: #ffb454; --ok: #3ddc97;
    --warn: #ffcc66; --bad: #ff6b6b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --panel: #fff; --line: #e2e5ea; --text: #1a1d23; --dim: #5f6673; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .sub { color: var(--dim); font-family: var(--mono); font-size: 12px; }
  .spacer { flex: 1; }
  .badge { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 999px;
           border: 1px solid var(--line); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  main { padding: 16px 20px 40px; }
  .stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
           margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 10px 12px; }
  .stat .k { color: var(--dim); font-size: 11px; text-transform: uppercase;
             letter-spacing: .06em; }
  .stat .v { font-family: var(--mono); font-size: 18px; margin-top: 3px; }
  .stat .v small { font-size: 12px; color: var(--dim); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          margin-top: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 10px 12px 6px; }
  .panel h2 { font-size: 12px; margin: 0 0 6px; font-weight: 600; color: var(--dim);
              text-transform: uppercase; letter-spacing: .06em; }
  .panel .empty { color: var(--dim); font-family: var(--mono); font-size: 12px; padding: 4px 0 8px; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 4px 6px;
       border-bottom: 1px solid var(--line); text-transform: uppercase; font-size: 11px;
       letter-spacing: .06em; }
  td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.k { color: var(--dim); white-space: nowrap; }
  .num { text-align: right; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { overflow-x: auto; }
  .err { color: var(--bad); font-family: var(--mono); font-size: 12px; }
</style>

<header>
  <h1 id="name">xrpld network status</h1>
  <span class="badge" id="health">…</span>
  <span class="spacer"></span>
  <span class="sub" id="updated"></span>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div class="panel">
    <h2>Nodes</h2>
    <div class="wrap"><table id="nodes"></table></div>
  </div>
  <div class="grid">
    <div class="panel"><h2>Last deploy</h2><div id="deploy"></div></div>
    <div class="panel"><h2>Pinned branches</h2><div id="branches"></div></div>
    <div class="panel"><h2>Faucet</h2><div id="faucet"></div></div>
    <div class="panel"><h2>Validator list</h2><div id="vl"></div></div>
    <div class="panel"><h2>Amendments</h2><div id="amendments"></div></div>
  </div>
  <p class="err" id="err"></p>
</main>

<script>
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtNum = v => v == null ? '–' : Number(v).toLocaleString();
const fmtDur = s => {
  if (s == null) return '–';
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
};
const empty = what => `<div class="empty">${esc(what)} not recorded in network.json</div>`;
const kv = rows => `<table>${rows.map(([k, v]) =>
  `<tr><td class="k">${esc(k)}</td><td>${v}</td></tr>`).join('')}</table>`;

// proposing (validator) and full (peer) are the healthy states; a state the sampler could
// not read is bad; anything on the way to full is a warning.
function stateBadge(node) {
  const state = node.server_state || (node.error ? 'unreachable' : 'unknown');
  const cls = node.healthy ? 'ok'
    : ['unreachable', 'unknown', 'disconnected'].includes(state) ? 'bad' : 'warn';
  return `<span class="badge ${cls}">${esc(state)}</span>`;
}

function renderHealth(health, status) {
  const badge = document.getElementById('health');
  if (!health) {
    badge.textContent = 'health unknown';
    badge.className = 'badge bad';
    return;
  }
  const failing = health.failing || [];
  badge.textContent = status === 200 ? 'healthy'
    : `degraded: ${failing.map(f => f.name).join(', ')}`;
  badge.className = 'badge ' + (status === 200 ? 'ok' : 'bad');
}

function renderStats(report) {
  const nodes = report.nodes || [];
  const validators = nodes.filter(n => n.role === 'validator');
  const peers = nodes.filter(n => n.role !== 'validator');
  const healthy = list => list.filter(n => n.healthy).length;
  const tile = (count, list) =>
    `${count}<small> / ${list.length}</small>`;
  const cells = [
    ['validators healthy', tile(healthy(validators), validators)],
    ['peers healthy', tile(healthy(peers), peers)],
    ['validated ledger', fmtNum(report.validated_ledger)],
    ['agreement', report.agreement
      ? '<span class="badge ok">all validators agree</span>'
      : '<span class="badge bad">validators differ</span>'],
  ];
  document.getElementById('stats').innerHTML = cells.map(
    ([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}

function renderNodes(nodes) {
  const head = `<tr><th>node</th><th>role</th><th>state</th><th>build</th>
    <th class="num">validated ledger</th><th class="num">peers</th><th>uptime</th></tr>`;
  const rows = nodes.map(n => `<tr>
    <td><a href="nodes/${encodeURIComponent(n.name)}/">${esc(n.name)}</a></td>
    <td class="k">${esc(n.role)}</td>
    <td>${stateBadge(n)}</td>
    <td>${esc(n.build_version || '–')}</td>
    <td class="num">${fmtNum(n.validated_ledger)}</td>
    <td class="num">${fmtNum(n.peers)}</td>
    <td>${fmtDur(n.uptime)}</td></tr>`).join('');
  document.getElementById('nodes').innerHTML = head + (rows || '<tr><td>no nodes configured</td></tr>');
}

function renderNetwork(net) {
  const deploy = net.last_deploy;
  document.getElementById('deploy').innerHTML = deploy ? kv([
    ['date', esc(deploy.date || '–')],
    ['sha', `<code>${esc(deploy.sha || '–')}</code>`],
    ['image', esc(deploy.image || '–')],
    ['genesis', deploy.genesis == null ? '–' : deploy.genesis ? 'yes' : 'no'],
    ['operator', esc(deploy.operator || '–')],
  ]) : empty('last deploy');

  const branches = net.branches || [];
  document.getElementById('branches').innerHTML = branches.length ? `<table>${branches.map(b =>
    `<tr><td class="k">${esc(b.repo || '')}</td><td>${b.pr_url
      ? `<a href="${esc(b.pr_url)}" rel="noopener">${esc(b.branch || b.pr_url)}</a>`
      : esc(b.branch || '–')}</td></tr>`).join('')}</table>` : empty('pinned branches');

  const faucet = net.faucet;
  document.getElementById('faucet').innerHTML = faucet ? kv([
    ['address', `<code>${esc(faucet.address || '–')}</code>`],
    ['balance', faucet.balance_xrp == null ? '–' : `${fmtNum(faucet.balance_xrp)} XRP`],
  ]) : empty('faucet');

  const vl = net.vl;
  document.getElementById('vl').innerHTML = vl ? kv([
    ['site', vl.site ? `<a href="${esc(vl.site)}" rel="noopener">${esc(vl.site)}</a>` : '–'],
    ['expiration', esc(vl.expiration || '–')],
  ]) : empty('validator list');

  const am = net.amendments;
  if (am && (am.enabled || am.expected)) {
    const enabled = new Set(am.enabled || []);
    const names = [...new Set([...(am.expected || []), ...(am.enabled || [])])].sort();
    document.getElementById('amendments').innerHTML = `<table>${names.map(name =>
      `<tr><td>${esc(name)}</td><td>${enabled.has(name)
        ? '<span class="badge ok">enabled</span>'
        : '<span class="badge warn">expected, not enabled</span>'}</td></tr>`).join('')}</table>`;
  } else {
    document.getElementById('amendments').innerHTML = empty('amendments');
  }
}

async function poll() {
  try {
    const [report, healthResp] = await Promise.all([
      fetch('api/network').then(r => r.json()),
      fetch('api/network/health'),
    ]);
    const health = await healthResp.json().catch(() => null);
    document.getElementById('err').textContent = '';
    if (report.name) document.getElementById('name').textContent = report.name + ' status';
    renderHealth(health, healthResp.status);
    renderStats(report);
    renderNodes(report.nodes || []);
    renderNetwork(report.network || {});
    document.getElementById('updated').textContent = report.generated_at
      ? 'updated ' + new Date(report.generated_at * 1000).toLocaleTimeString() : '';
  } catch (err) {
    document.getElementById('err').textContent = 'cannot reach the status API: ' + err.message;
  }
}

poll();
setInterval(poll, 10000);
</script>
